name: CI — Bun-Neon Driven by Sectium Browser Baseline

on:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      baseline_tag:
        description: 'Sectium Browser baseline tag to verify against'
        required: true
        default: 'v0.5.0-baseline'

jobs:
  verify-against-sectium-baseline:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Run Zero-JSC Bun-Neon Compatibility Suite
        run: node --test bun-neon.test.mts

      - name: Hydrate & Verify Dependencies Directly from Canonical O(1) Ghost CAS (cas-v1)
        run: |
          node -e "
            const crypto = require('crypto');
            const INDEX_URL = 'https://raw.githubusercontent.com/awesome-os/b8g-ghost/main/manifests/index.json';
            (async () => {
              const idx = await (await fetch(INDEX_URL)).json();
              console.log('[bun-neon] Connected to Ghost CAS:', idx.schema, 'entries=' + idx.total_entries);
              for (const f of ['v8-shared-win64.b8p', 'bun-neon-v8.exe', 'libbrotli-linux-x64.so', 'libsqlite3-wasm32-wasi.wasm']) {
                const entry = idx.entries[f];
                if (!entry) throw new Error('Missing ' + f + ' in canonical Ghost CAS index');
                const buf = Buffer.from(await (await fetch(entry.download_url)).arrayBuffer());
                const hash = crypto.createHash('sha256').update(buf).digest('hex');
                if (hash !== entry.sha256) throw new Error('SHA-256 mismatch for ' + f);
                console.log('[CAS-VERIFIED]', f, buf.length, 'bytes, sha256=' + hash.slice(0, 16) + '...');
              }
            })();
          "
