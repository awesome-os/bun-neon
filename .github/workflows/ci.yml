name: CI — Bun-Neon Driven by Sectium Browser Baseline

on:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      baseline_tag:
        description: 'Sectium Browser baseline tag to verify against'
        required: true
        default: 'v0.5.0-baseline'

jobs:
  verify-against-sectium-baseline:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Run Zero-JSC Bun-Neon Compatibility Suite
        run: node --test bun-neon.test.mts

      - name: Pull & Verify V8 Substrate from awesome-os/sectium-browser Baseline
        env:
          GH_TOKEN: ${{ github.token }}
          BASELINE_TAG: ${{ inputs.baseline_tag || 'v0.5.0-baseline' }}
        run: |
          mkdir -p .baseline
          gh release download "$BASELINE_TAG" \
            --repo awesome-os/sectium-browser \
            --pattern "RollingReleaseManifest.json" \
            --pattern "v8-shared-win64.b8p" \
            --pattern "bun-neon-v8.exe" \
            --dir .baseline --clobber
          node -e "
            const fs = require('fs');
            const crypto = require('crypto');
            const m = JSON.parse(fs.readFileSync('.baseline/RollingReleaseManifest.json', 'utf8'));
            if (m.brand.mascot !== 'Lumi White Dragon') throw new Error('Expected Lumi White Dragon baseline');
            for (const f of ['v8-shared-win64.b8p', 'bun-neon-v8.exe']) {
              const entry = m.components.find(c => c.filename === f);
              if (!entry) throw new Error('Missing ' + f + ' in manifest');
              const hash = crypto.createHash('sha256').update(fs.readFileSync('.baseline/' + f)).digest('hex');
              if (hash !== entry.sha256) throw new Error('SHA-256 mismatch for ' + f);
              console.log('[VERIFIED]', f, entry.bytes, 'bytes, sha256=' + hash.slice(0, 16) + '...');
            }
          "
