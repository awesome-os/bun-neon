name: Release — bun-neon (Zero-JSC Bun API + GhostModuleRegistry FFI)

on:
  workflow_dispatch:
    inputs:
      tag:
        description: 'Release tag (e.g. v0.1.0)'
        required: true
        default: 'v0.1.0'

permissions:
  contents: write

jobs:
  release-bun-neon:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Run Zero-JSC Bun-Neon Compatibility Suite
        run: node --test bun-neon.test.mts
      - name: Package bun-neon Release
        run: |
          mkdir -p dist
          tar -czf dist/bun-neon.tar.gz *.mts README.md LICENSE
          (cd dist && sha256sum * > SHA256SUMS.txt)
          ls -lh dist/
      - name: Publish GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ inputs.tag || 'v0.1.0' }}
        run: |
          gh release delete "$TAG" --yes 2>/dev/null || true
          gh release create "$TAG" dist/* \
            --title "bun-neon ${TAG} — Zero-JSC Bun.* API & GhostModuleRegistry Versioned FFI" \
            --notes "Zero-JSC \`Bun.*\`, \`bun:sqlite\`, \`bun:test\`, and \`bun:ffi\` with \`ghostFFI()\` versioned CAS loading driven off \`awesome-os/sectium-browser @ v0.5.0-baseline\`."
